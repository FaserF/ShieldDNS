name: PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, review_requested]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    uses: FaserF/repo-template/.github/workflows/reusable-pr-reviewer.yml@e8f0d30ea124ee57668c45f590fedb5a3804a773 # v1.0.24
    secrets: inherit
