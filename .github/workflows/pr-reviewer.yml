name: PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, review_requested]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    uses: FaserF/repo-template/.github/workflows/reusable-pr-reviewer.yml@6e3166402d636358ea41cec93278d1d5c47910a0 # v1.0.0
    secrets: inherit
