name: PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, review_requested]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    uses: FaserF/repo-template/.github/workflows/reusable-pr-reviewer.yml@80e0d10b029e916e7815e99a3d5950c0f081e82f # v1.0.14
    secrets: inherit
