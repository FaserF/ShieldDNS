name: PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, review_requested]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    uses: FaserF/repo-template/.github/workflows/reusable-pr-reviewer.yml@5ed30296646f6a5358ed3267e5ea12630c0b756a # v1.0.12
    secrets: inherit
