name: PR Reviewer

on:
  pull_request:
    types: [opened, synchronize, reopened, review_requested]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    uses: FaserF/repo-template/.github/workflows/reusable-pr-reviewer.yml@bb7c89863ddbd1db78b84756002adf4433eebdcc # v1.0.19
    secrets: inherit
