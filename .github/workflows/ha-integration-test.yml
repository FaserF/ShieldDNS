name: HA Integration Live End-to-End Test

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  live-integration-test:
    name: ShieldDNS Container <-> HA Integration Live Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout ShieldDNS Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout ha-shielddns Integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'FaserF/ha-shielddns'
          path: 'ha-shielddns'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: shielddns:test

      - name: Generate Self-Signed Certs & Start Container
        run: |
          mkdir ssl
          openssl req -x509 -newkey rsa:4096 -keyout ssl/privkey.pem -out ssl/fullchain.pem -days 365 -nodes -subj "/CN=localhost"
          chmod -R 755 ssl
          chmod 644 ssl/*
          docker run -d --name shielddns -p 8080:8080 -p 853:853 -v ${{ github.workspace }}/ssl:/ssl -e UPSTREAM_DNS=8.8.8.8 -e CERT_FILE=/ssl/fullchain.pem -e KEY_FILE=/ssl/privkey.pem -e DOH_PORT=8080 shielddns:test

      - name: Wait for ShieldDNS API / Web UI
        run: |
          for i in {1..20}; do
            if curl -s http://localhost:8080/admin/index.html | grep -q "ShieldDNS"; then
              echo "ShieldDNS server is up and responsive."
              break
            fi
            echo "Waiting for ShieldDNS server..."
            sleep 2
          done

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install HA Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pyyaml pytest pytest-asyncio pytest-cov homeassistant aiohttp pytest-homeassistant-custom-component

      - name: Run Integration Tests Against Live ShieldDNS Container
        id: integration_tests
        run: |
          cd ha-shielddns
          if ! SHIELDDNS_TEST_SERVER_URL="http://127.0.0.1:8080" PYTHONPATH=. pytest tests/; then
            echo "::warning title=Integration Tests Failed::HA integration tests encountered errors but are configured as non-blocking for release."
          fi

      - name: Container Logs Output (Debugging)
        if: always()
        run: docker logs shielddns

