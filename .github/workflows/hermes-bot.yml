name: Hermes Interactive Bot

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  issues:
    types: [edited]
  pull_request:
    types: [edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  bot:
    uses: FaserF/repo-template/.github/workflows/reusable-hermes-bot.yml@41888f6ce3539f9147328623f87c5333f4d5a019 # v1.0.10
    secrets: inherit
