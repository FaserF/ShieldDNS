name: Hermes Interactive Bot

on:
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  issues:
    types: [edited]
  pull_request:
    types: [edited]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  bot:
    uses: FaserF/repo-template/.github/workflows/reusable-hermes-bot.yml@0a28188883d09302a455dc0690d51dac29f07ed9 # v1.0.26
    secrets: inherit
