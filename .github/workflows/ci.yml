name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    uses: FaserF/repo-template/.github/workflows/reusable-ci.yml@41888f6ce3539f9147328623f87c5333f4d5a019 # v1.0.10
    with:
      project_type: "generic"
    secrets: inherit
