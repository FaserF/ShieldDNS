name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    uses: FaserF/repo-template/.github/workflows/reusable-ci.yml@fd84eaa19fc59f7a7d0db1545f1a045b8709892c # v1.0.23
    with:
      project_type: "generic"
    secrets: inherit
