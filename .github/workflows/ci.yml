name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    uses: FaserF/repo-template/.github/workflows/reusable-ci.yml@e8f0d30ea124ee57668c45f590fedb5a3804a773 # v1.0.24
    with:
      project_type: "generic"
    secrets: inherit
