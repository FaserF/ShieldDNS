name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    uses: FaserF/repo-template/.github/workflows/reusable-ci.yml@5ed30296646f6a5358ed3267e5ea12630c0b756a # v1.0.12
    with:
      project_type: "generic"
    secrets: inherit
