name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    uses: FaserF/repo-template/.github/workflows/reusable-ci.yml@0a1c41c5ff41169eb149bf4be0fd628e6bbef192 # v1.0.21
    with:
      project_type: "generic"
    secrets: inherit
