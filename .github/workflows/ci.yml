name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    uses: FaserF/repo-template/.github/workflows/reusable-ci.yml@bb7c89863ddbd1db78b84756002adf4433eebdcc # v1.0.19
    with:
      project_type: "generic"
    secrets: inherit
