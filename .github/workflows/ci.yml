name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    uses: FaserF/repo-template/.github/workflows/reusable-ci.yml@80e0d10b029e916e7815e99a3d5950c0f081e82f # v1.0.14
    with:
      project_type: "generic"
    secrets: inherit
