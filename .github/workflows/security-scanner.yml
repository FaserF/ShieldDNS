name: Security Scanner

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  security-scan:
    uses: FaserF/repo-template/.github/workflows/reusable-security-scanner.yml@0a28188883d09302a455dc0690d51dac29f07ed9 # v1.0.26
    secrets: inherit
