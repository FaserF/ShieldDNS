name: Security Scanner

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  security-scan:
    uses: FaserF/repo-template/.github/workflows/reusable-security-scanner.yml@bb7c89863ddbd1db78b84756002adf4433eebdcc # v1.0.19
    secrets: inherit
