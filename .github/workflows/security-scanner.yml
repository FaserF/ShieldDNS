name: Security Scanner

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  security-scan:
    uses: FaserF/repo-template/.github/workflows/reusable-security-scanner.yml@0a1c41c5ff41169eb149bf4be0fd628e6bbef192 # v1.0.21
    secrets: inherit
