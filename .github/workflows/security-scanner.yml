name: Security Scanner

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  security-scan:
    uses: FaserF/repo-template/.github/workflows/reusable-security-scanner.yml@e8f0d30ea124ee57668c45f590fedb5a3804a773 # v1.0.24
    secrets: inherit
