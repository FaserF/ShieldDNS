name: Security Scanner

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  security-scan:
    uses: FaserF/repo-template/.github/workflows/reusable-security-scanner.yml@5ed30296646f6a5358ed3267e5ea12630c0b756a # v1.0.12
    secrets: inherit
