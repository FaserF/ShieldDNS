name: OpenHands Issue Resolver

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve:
    if: github.event.label.name == 'openhands:ready'
    uses: FaserF/repo-template/.github/workflows/reusable-openhands-resolver.yml@6e3166402d636358ea41cec93278d1d5c47910a0 # v1.0.0
    secrets: inherit
