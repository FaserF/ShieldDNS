name: OpenHands Issue Resolver

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve:
    if: github.event.label.name == 'openhands:ready'
    uses: FaserF/repo-template/.github/workflows/reusable-openhands-resolver.yml@e8f0d30ea124ee57668c45f590fedb5a3804a773 # v1.0.24
    secrets: inherit
