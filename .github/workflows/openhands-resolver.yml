name: OpenHands Issue Resolver

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve:
    if: github.event.label.name == 'openhands:ready'
    uses: FaserF/repo-template/.github/workflows/reusable-openhands-resolver.yml@0a1c41c5ff41169eb149bf4be0fd628e6bbef192 # v1.0.21
    secrets: inherit
