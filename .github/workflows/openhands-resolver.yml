name: OpenHands Issue Resolver

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve:
    if: github.event.label.name == 'openhands:ready'
    uses: FaserF/repo-template/.github/workflows/reusable-openhands-resolver.yml@bb7c89863ddbd1db78b84756002adf4433eebdcc # v1.0.19
    secrets: inherit
