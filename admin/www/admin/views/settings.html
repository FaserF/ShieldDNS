{{define "settings"}}
            <section id="settings" class="view hidden">
                <header>
                    <h1>Settings</h1>
                </header>
                <div class="search-bar-integrated mb-4">
                    <input type="text" id="settings-search-input" placeholder="Search for settings (e.g. DNS, Security, DGA)..." autocomplete="off">
                </div>

                <div class="settings-tabs-nav" id="settings-tabs-nav">
                    <button type="button" class="settings-tab-btn active" data-tab="all"><i class="fas fa-layer-group"></i> All</button>
                    <button type="button" class="settings-tab-btn" data-tab="dns"><i class="fas fa-network-wired"></i> DNS & Networking</button>
                    <button type="button" class="settings-tab-btn" data-tab="security"><i class="fas fa-shield-alt"></i> Threat Protection</button>
                    <button type="button" class="settings-tab-btn" data-tab="system"><i class="fas fa-sliders-h"></i> System & Storage</button>
                    <button type="button" class="settings-tab-btn" data-tab="access"><i class="fas fa-key"></i> Access & Security</button>
                    <button type="button" class="settings-tab-btn" data-tab="cluster"><i class="fas fa-network-wired"></i> Cluster & Multi-Node</button>
                </div>

                <form id="settings-form">

                    {{template "settings_main" .}}
                    {{template "settings_advanced" .}}
                <div class="settings-section" data-category="access">
                    <button id="logout-btn" class="btn danger">Logout</button>
                </div>

                <div class="settings-save-footer">
                    <div class="save-status help" id="settings-save-status"
                        style="margin-right: auto; font-size: 0.85rem; opacity: 0.7;">
                        All changes must be saved. Reboot (via Full System Refresh) might be required for some CoreDNS
                        modifications.
                    </div>
                    <button type="button" class="btn primary"
                        onclick="document.getElementById('settings-form').requestSubmit()">Save Configuration</button>
                </div>
            </section>
{{end}}
